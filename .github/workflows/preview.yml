name: preview

# Manual only: a public preview goes out when someone dispatches this, never on push.
on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: 'Lane marker for the banner. Leave empty for the clean copy (ADR 0003).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the digest page
        env:
          LANE_MARKER: ${{ inputs.lane_marker }}
        run: pnpm run preview
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/preview

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
